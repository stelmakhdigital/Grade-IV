[pytest]
testpaths = tests
markers =
    e2e: реальные ML-модели (faster-whisper + Silero); требует скачивания/загрузки моделей
filterwarnings =
    # B4: это предупреждение порождает САМ CPython 3.14: asyncio.to_thread() (app/stt_stream.py)
    # → run_in_executor → deprecated asyncio.iscoroutinefunction (asyncio/coroutines.py).
    # Прямых вызовов asyncio.iscoroutinefunction в проекте НЕТ (проверено grep), поэтому
    # «заменить на inspect.iscoroutinefunction» в нашем коде нечего — чинится только
    # stdlib-фиксом (снятие в 3.16). Точечно игнорируем именно эту DeprecationWarning,
    # остальные (например Starlette/torch) не трогаем.
    ignore:.*asyncio\.iscoroutinefunction.*:DeprecationWarning
