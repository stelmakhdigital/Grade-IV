# Prometheus (compose-профиль monitoring) — скрейп grade-api :8000/metrics.
#
# /metrics закрыт basic-auth (METRICS_USER/METRICS_PASSWORD на api): метрики
# содержат пути, идентификаторы сессий и лаги голосового контура. Значения
# Prometheus подставляет из окружения контейнера (compose их передаёт); пустой
# пароль на api означает, что маршрута нет вовсе и мишень будет красной.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: grade-api
    metrics_path: /metrics
    basic_auth:
      username: @METRICS_USER@
      password: @METRICS_PASSWORD@
    static_configs:
      - targets: ["api:8000"]
