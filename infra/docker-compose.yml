# Сервис «Грейд» — деплой (WP-12).
#   prod (по умолчанию в make up) — полный стек: api+frontend+voice+sandbox+postgres
#   gpu  — voice на GPU-узле (nvidia; STT large-v3 + TTS быстрее)
# Запуск:  docker compose -f infra/docker-compose.yml --profile prod up --build
# GPU:     docker compose -f infra/docker-compose.yml --profile prod --profile gpu up
# Prod + TLS (caddy) и мониторинг (Prometheus+Grafana): + --profile monitoring, см. docs/OPERATIONS.md
# Локальный dev без compose: make install && make run-api (см. Makefile/README).
name: grade

services:
  api:
    build:
      context: ../services/api
      dockerfile: ../../infra/docker/api.Dockerfile
    image: grade/api:dev
    ports:
      - "8000:8000"
    environment:
      ADDR: ":8000"
      DATABASE_URL: "postgres://grade:grade@postgres:5432/grade"
      JWT_SECRET: "${JWT_SECRET:-change-me-in-production}"
      VOICE_URL: "http://voice:8100"
      SANDBOX_URL: "http://sandbox:8200"
      LLM_BASE_URL: "${LLM_BASE_URL:-http://localhost:8300/v1}"
      LLM_MODEL: "${LLM_MODEL:-Qwen3-4B}"
    depends_on:
      - postgres
      - voice
      - sandbox
    restart: unless-stopped
    profiles: [prod]

  sandbox:
    build:
      context: ../services/sandbox
      dockerfile: ../../infra/docker/sandbox.Dockerfile
    image: grade/sandbox:dev
    ports:
      - "8200:8200"
    environment:
      SANDBOX_MODE: "${SANDBOX_MODE:-docker}"
    volumes:
      # WP-6: управление контейнерами сессий
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    profiles: [prod]

  voice:
    build:
      context: ../services/voice
      dockerfile: ../../infra/docker/voice.Dockerfile
    image: grade/voice:dev
    ports:
      - "8100:8100"
    environment:
      # GPU-профиль: CUDA-torch + large-v3 (переопределяется host-переменными)
      STT_DEVICE: "${STT_DEVICE:-cpu}"
      STT_MODEL: "${STT_MODEL:-small}"
      # ML-модели — каталог ./models в корне репо (scripts/download-models.sh)
      STT_DOWNLOAD_ROOT: /models/stt
      TTS_MODEL_DIR: /models/tts
    volumes:
      - ../models:/models:ro
    restart: unless-stopped
    profiles: [prod, gpu]
    # gpu-профиль: device-requests (nvidia-container-toolkit на хосте);
    # limits — потолок CPU/памяти (VOICE_CPU_LIMIT / VOICE_MEM_LIMIT из .env)
    deploy:
      resources:
        limits:
          cpus: "${VOICE_CPU_LIMIT:-4}"
          memory: ${VOICE_MEM_LIMIT:-8g}
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  frontend:
    build:
      context: ../services/frontend
      dockerfile: ../../infra/docker/frontend.Dockerfile
    image: grade/frontend:dev
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped
    profiles: [prod]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: grade
      POSTGRES_PASSWORD: grade
      POSTGRES_DB: grade
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    profiles: [prod]

  # === prod: TLS reverse-proxy (Фаза 5) ===
  # Всё (SPA + /api/ + /ws) -> frontend:80 (nginx), который проксирует
  # /api/, /healthz, /ws (Upgrade) на api:8000. TLS: Let's Encrypt (default)
  # или internal CA Caddy (CADDY_TLS=internal — локальная VPS-проверка).
  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      GRADE_DOMAIN: "${GRADE_DOMAIN:-localhost}"
      CADDY_TLS: "${CADDY_TLS:-}"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    restart: unless-stopped
    profiles: [prod]

  # === monitoring: Prometheus + Grafana (Фаза 5) ===
  prometheus:
    image: prom/prometheus:v2.53.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    profiles: [monitoring]

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-change-me}"
    volumes:
      - ./monitoring/grafana-datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - ./monitoring/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./monitoring/grafana-dashboard.json:/etc/grafana/dashboards/grade-voice-slo.json:ro
      - grafana_data:/var/lib/grafana
    profiles: [monitoring]

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  prometheus_data:
  grafana_data:
