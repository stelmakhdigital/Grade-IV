# Сервис «Грейд» — деплой (WP-12).
#   prod (по умолчанию в make up) — полный стек: api+frontend+voice+sandbox+postgres
#   gpu  — voice на GPU-узле (nvidia; STT large-v3 + TTS быстрее)
# Запуск:  docker compose -f infra/docker-compose.yml --profile prod up --build
# GPU:     docker compose -f infra/docker-compose.yml --profile prod --profile gpu up
# Prod + TLS (caddy) и мониторинг (Prometheus+Grafana): + --profile monitoring, см. docs/OPERATIONS.md
# Локальный dev без compose: make install && make run-api (см. Makefile/README).
name: grade

services:
  api:
    build:
      context: ../services/api
      dockerfile: ../../infra/docker/api.Dockerfile
    image: grade/api:dev
    # Наружу не публикуется: вход через caddy → frontend(nginx), который
    # проксирует /api/, /healthz и /ws. Публикация 8000 наружу заодно
    # открывала бы /metrics любому, кто достучался до хоста.
    environment:
      # Профиль prod = prod-среда: без этого молчат prod-гарды (dev-секрет
      # JWT, LLM_MOCK).
      APP_ENV: "${APP_ENV:-prod}"
      ADDR: ":8000"
      DATABASE_URL: "postgres://grade:grade@postgres:5432/grade"
      # Без секрета профиль prod не поднимается: подпись JWT известным
      # значением = подделка токена любого пользователя. Плейсхолдер
      # отсекает и прод-гард в config.Load.
      JWT_SECRET: "${JWT_SECRET:?prod: задайте JWT_SECRET в .env}"
      VOICE_URL: "http://voice:8100"
      SANDBOX_URL: "http://sandbox:8200"
      # spec-24: фоновое пополнение пула задач (пусто — выключено)
      SANDBOX_ADMIN_TOKEN: "${SANDBOX_ADMIN_TOKEN:-}"
      LLM_BASE_URL: "${LLM_BASE_URL:-http://localhost:8300/v1}"
      LLM_MODEL: "${LLM_MODEL:-Qwen3-4B}"
      # Ключ LLM-узла без него прод не авторизуется; LLM_MOCK=1 — детерминированный
      # мок вместо узла (локальная проверка prod-профиля, CI).
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_MOCK: "${LLM_MOCK:-}"
      RESUME_DIR: "/data/resumes"
      # Пути абсолютные: у образа рабочая директория / (бинарник в
      # /usr/local/bin), дефолт «config/…json» резолвился бы в /config, а
      # json-дефолты в образ не попадают — берём из смонтированного config/.
      ROLE_TRACKS_FILE: "/app/config/roles.json"
      TTS_VOICES_FILE: "/app/config/tts-voices.json"
      INTRO_OPENINGS_FILE: "/app/config/openings.json"
      # /metrics — basic-auth. Пустой пароль = маршрута нет вовсе; тогда
      # prometheus (профиль monitoring) покажет мишень недоступной, вместо
      # тихого чтения метрик всей docker-сетью.
      METRICS_USER: "${METRICS_USER:-prometheus}"
      METRICS_PASSWORD: "${METRICS_PASSWORD:-}"
    # Не root: правки админа раньше ложились в config/ репозитория root-овыми
    # файлами. uid совпадаем с хостовым — bind-монтированный config/ принадлежит
    # ему. На типичной машине это и есть 1000; иначе GRADE_UID=$(id -u) GRADE_GID=$(id -g) make up
    user: "${GRADE_UID:-1000}:${GRADE_GID:-1000}"
    # LLM-узел может жить на том же хосте, что и контейнеры (vLLM/llama.cpp
    # наружу docker-сетью) — тогда LLM_BASE_URL=http://host.docker.internal:8000/v1.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Файлы резюме кандидатов (текст из них — в БД, оригинал — здесь).
      - resumes:/data/resumes
      # Конфигурация: roles.json / tts-voices.json / openings.json. В образ api
      # не попадают (контекст сборки = services/api), правки админа пишутся
      # туда же, поэтому монтируем каталогом на запись. Относительные пути в
      # compose считаются от каталога файла (infra/), то есть ../config =
      # <репо>/config: «../../config» уезжал на уровень выше репо, и docker
      # молча поднимал там пустой каталог — реестр голосов был пустой.
      - ../config:/app/config
    # O4: порядок старта по готовности, а не по запуску. Об образах: у api,
    # sandbox и voice HEALTHCHECK в Dockerfile (wget/curl на их /health*),
    # здесь остаётся дождаться postgres — иначе api стартует без БД и падает.
    depends_on:
      postgres:
        condition: service_healthy
      voice:
        condition: service_healthy
      sandbox:
        condition: service_healthy
    restart: unless-stopped
    profiles: [prod]

  sandbox:
    build:
      context: ../services/sandbox
      dockerfile: ../../infra/docker/sandbox.Dockerfile
    image: grade/sandbox:dev
    ports:
      - "8200:8200"
    environment:
      SANDBOX_MODE: "${SANDBOX_MODE:-docker}"
      # spec-20 / BUG-20261103-025: задачи банка идут через pytest, которого
      # нет в python:3.12-slim — образ с запечённым pytest собирается ниже.
      SANDBOX_IMAGE_PYTHON: "grade/python-tests:dev"
      # spec-24: пул сгенерированных задач + токен управления (/admin/tasks*).
      # Без SANDBOX_ADMIN_TOKEN эндпоинты отдают 503 — генерация выключена.
      SANDBOX_TASKS_FILE: "/var/lib/grade-sandbox/generated-tasks.json"
      SANDBOX_ADMIN_TOKEN: "${SANDBOX_ADMIN_TOKEN:-}"
      # Каталог прогонов. В docker-режиме путь из -v разрешает ДОКЕР-ДЕМОН на
      # хосте, а не песочница, поэтому путь обязан быть виден под тем же
      # абсолютным адресом с обеих сторон (synchronized bind ниже). Иначе демон
      # создаёт пустой каталог, контейнер прогона не видит ни решение, ни
      # grade/overlay.json — и падает каждый запуск. Дефолт песочницы
      # (~/.local/share/grade-sandbox) внутрь контейнера не виден наружу:
      # «go: reading overlay: open /grade/overlay.json» на каждом прогоне
      # (найдено на полном прод-старте 2026-11-26).
      SANDBOX_WORKDIR_BASE: "${SANDBOX_WORK_ROOT:-/var/lib/grade-sandbox/work}"
    volumes:
      # Тот же путь с двух сторон — обязательно (см. SANDBOX_WORKDIR_BASE выше). На хосте
      # каталог нужно создать и отдать пользователю песочницы:
      #   sudo mkdir -p /var/lib/grade-sandbox/work && sudo chown 1000:1000 $_
      # Локально без root: SANDBOX_WORK_ROOT=/tmp/grade-sandbox-work
      - "${SANDBOX_WORK_ROOT:-/var/lib/grade-sandbox/work}:${SANDBOX_WORK_ROOT:-/var/lib/grade-sandbox/work}"
      # WP-6: управление контейнерами сессий
      - /var/run/docker.sock:/var/run/docker.sock
      # spec-24: принятые gate задачи должны переживать пересборку контейнера
      - sandbox_tasks:/var/lib/grade-sandbox
    depends_on:
      - python-tests
    restart: unless-stopped
    profiles: [prod]

  # Образ python-задач (сборка при up --build; сам контейнер мгновенно
  # завершается — раннер использует только image).
  python-tests:
    image: grade/python-tests:dev
    build:
      context: ..
      dockerfile: infra/docker/sandbox-python.Dockerfile
    entrypoint: ["true"]
    profiles: [prod]

  voice:
    build:
      context: ../services/voice
      dockerfile: ../../infra/docker/voice.Dockerfile
      # Откуда брать pip-пакеты. Дефолт — pypi.org; на сети без него ставим
      # зеркало в .env (PIP_INDEX_URL=https://зеркало/pypi/simple) — иначе
      # сборка voice падает на выборе setuptools. Дефолт оставлен pypi.org,
      # чтобы зеркало чьей-то сети не стало дефолтом прод-сборки.
      args:
        PIP_INDEX_URL: "${PIP_INDEX_URL:-https://pypi.org/simple}"
        TORCH_INDEX_URL: "${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}"
    image: grade/voice:dev
    user: "${GRADE_UID:-1000}:${GRADE_GID:-1000}" # писать некуда (/models :ro), но и root не нужен
    ports:
      - "8100:8100"
    environment:
      # STT — GigaAM v3 (дефолт проекта, AGENTS.md); faster-whisper — опция
      # (её переменные STT_*/GPU-профиль переопределяются host-ENV).
      VOICE_STT_PROVIDER: "${VOICE_STT_PROVIDER:-gigaam}"
      GIGAAM_MODEL: "${GIGAAM_MODEL:-v3_e2e_rnnt}"
      GIGAAM_DEVICE: "${GIGAAM_DEVICE:-}"
      # ML-модели — каталог ./models в корне репо (scripts/download-models.sh).
      # Монтируется ro, то gigaam-ckpt (.ckpt) должен быть скачан заранее.
      GIGAAM_DOWNLOAD_ROOT: /models/stt-gigaam
      STT_DEVICE: "${STT_DEVICE:-cpu}"
      STT_MODEL: "${STT_MODEL:-small}"
      STT_DOWNLOAD_ROOT: /models/stt
      TTS_MODEL_DIR: /models/tts
      # Спикер по умолчанию (когда у пользователя голос не выбран). Должен
      # быть среди реальных спикеров v5_ru: «ru_01» таковым не был и Silero
      # подставлял xenia с WARN на каждую реплику.
      TTS_SPEAKER: "${TTS_SPEAKER:-xenia}"
    volumes:
      - ../models:/models:ro
    restart: unless-stopped
    profiles: [prod, gpu]
    # gpu-профиль: device-requests (nvidia-container-toolkit на хосте);
    # limits — потолок CPU/памяти (VOICE_CPU_LIMIT / VOICE_MEM_LIMIT из .env)
    deploy:
      resources:
        limits:
          cpus: "${VOICE_CPU_LIMIT:-4}"
          memory: ${VOICE_MEM_LIMIT:-8g}
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  frontend:
    build:
      context: ../services/frontend
      dockerfile: ../../infra/docker/frontend.Dockerfile
    image: grade/frontend:dev
    # Наружу не публикуем: nginx — внутренний слой, вход только через caddy
    # (:80/:443, TLS + HTTP→HTTPS). Публикация 8080 давала второй, незащищённый
    # вход в то же приложение в обход TLS.
    expose:
      - "80"
    depends_on:
      - api
    restart: unless-stopped
    profiles: [prod]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: grade
      POSTGRES_PASSWORD: grade
      POSTGRES_DB: grade
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grade -d grade"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    profiles: [prod]

  # === prod: TLS reverse-proxy (Фаза 5) ===
  # Всё (SPA + /api/ + /ws) -> frontend:80 (nginx), который проксирует
  # /api/, /healthz, /ws (Upgrade) на api:8000. TLS: Let's Encrypt (default)
  # или internal CA Caddy (CADDY_TLS=internal — локальная VPS-проверка).
  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      GRADE_DOMAIN: "${GRADE_DOMAIN:-localhost}"
      CADDY_TLS: "${CADDY_TLS:-}"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      # Админ-API Caddy (127.0.0.1:2019) отвечает только внутри контейнера,
      # наружу он не торчит. /health у Caddy 2 нет — он возвращает 404, и
      # проба никогда не проходила (контейнер висел unhealthy при работающем
      # TLS). /config/ отвечает 200 только с загруженной конфигурацией, то есть
      # это честная readiness-проба.
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      - frontend
    restart: unless-stopped
    profiles: [prod]

  # === monitoring: Prometheus + Grafana (Фаза 5) ===
  prometheus:
    image: prom/prometheus:v2.53.1
    # Prometheus НЕ разворачивает переменные окружения в конфиге: basic_auth с
    # ${VAR} уходит в запрос литералом и /metrics отвечает 401. Значения
    # подставляются в prometheus.yml на старте (заполнители @METRICS_*@);
    # разделитель sed — #, в base64-пароле его нет.
    environment:
      METRICS_USER: "${METRICS_USER:-prometheus}"
      METRICS_PASSWORD: "${METRICS_PASSWORD:-}"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sed "s#@METRICS_USER@#$$METRICS_USER#; s#@METRICS_PASSWORD@#$$METRICS_PASSWORD#" \
          /etc/prometheus/prometheus.yml > /tmp/prometheus.yml
        exec /bin/prometheus --config.file=/tmp/prometheus.yml \
          --storage.tsdb.path=/prometheus --storage.tsdb.retention.time=7d
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    profiles: [monitoring]

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-change-me}"
    volumes:
      - ./monitoring/grafana-datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - ./monitoring/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./monitoring/grafana-dashboard.json:/etc/grafana/dashboards/grade-voice-slo.json:ro
      - grafana_data:/var/lib/grafana
    profiles: [monitoring]

volumes:
  pgdata:
  sandbox_tasks:
  resumes:
  caddy_data:
  caddy_config:
  prometheus_data:
  grafana_data:
