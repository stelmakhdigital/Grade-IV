# «Грейд» — CI (Фаза 5): сборка + тесты всех сервисов + REST-смоук.
# Запуск: push в master + pull_request. Таймауты: go ~10 мин (load-тест 20 с
# входит в make test), frontend ~5 мин, voice ~15 мин (pip ML-стек), smoke ~5 мин.
# sandbox-docker — docker-пробы сандбокса (network=none, лимиты, OOM), ~10 мин.
name: ci

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: "Go (api + sandbox: vet, test, build)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: |
            services/api/go.sum
            services/sandbox/go.sum
      - name: gofmt (api + sandbox) — регресс форматирования (T4)
        run: |
          set -e
          for m in services/api services/sandbox; do
            echo "=== gofmt -l $m ==="
            out=$(cd "$m" && gofmt -l .)
            if [ -n "$out" ]; then
              echo "::error::gofmt: не отформатированы файлы: $out"
              (cd "$m" && gofmt -d $out)
              exit 1
            fi
          done
          echo "gofmt: чисто"
      - name: go vet (api + sandbox)
        run: |
          set -e
          (cd services/api && go vet ./...)
          (cd services/sandbox && go vet ./...)
      - name: api — test + build
        working-directory: services/api
        run: |
          go test -count=1 ./...
          CGO_ENABLED=0 go build -o bin/api ./cmd/api
      - name: sandbox — test + build
        working-directory: services/sandbox
        run: |
          go test -count=1 ./...
          CGO_ENABLED=0 go build -o bin/sandbox ./cmd/sandbox

  frontend:
    name: Frontend (tsc, vitest, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          # 10: pnpm-workspace.yaml (allowBuilds esbuild) создан pnpm approve-builds ≥10.1 —
          # на pnpm 9 файл валиден нет (ошибка «packages field missing or empty»)
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: services/frontend/pnpm-lock.yaml
      - name: install + checks
        working-directory: services/frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm exec tsc --noEmit
          pnpm exec vitest run
          pnpm exec vite build

  voice:
    name: Voice (pytest, fake-провайдеры)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install (CPU torch ПЕРЕД requirements — иначе nvidia-* ~2 ГБ)
        working-directory: services/voice
        run: |
          python -m venv .venv
          .venv/bin/pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          .venv/bin/pip install -q -r requirements.txt
      - name: pytest (fake-провайдеры — детерминизм CI, без ML-моделей)
        working-directory: services/voice
        env:
          VOICE_STT_PROVIDER: fake
          VOICE_TTS_PROVIDER: fake
        run: .venv/bin/python -m pytest -q
